openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Wealth Levels API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User profile operations
  - name: auth
    description: PIN and TOTP authentication
  - name: dashboard
    description: Dashboard and character data
  - name: quests
    description: Quest management
  - name: skills
    description: Skills management
  - name: builds
    description: Guild Hall / builds management
  - name: budget
    description: Budget tracking
  - name: wealth
    description: Wealth breakdown
  - name: evaluation
    description: Monthly evaluation
  - name: admin
    description: Admin panel operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── User profile ────────────────────────────────────────────────────────────
  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
    patch:
      operationId: updateMe
      tags: [users]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized

  # ─── PIN management ──────────────────────────────────────────────────────────
  /users/me/pin-status:
    get:
      operationId: getPinStatus
      tags: [auth]
      summary: Check whether the current user has a PIN set
      responses:
        "200":
          description: PIN status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PinStatus"
        "401":
          description: Unauthorized

  /users/me/pin:
    post:
      operationId: createPin
      tags: [auth]
      summary: Set a PIN for the first time
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePinInput"
      responses:
        "200":
          description: PIN created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Unauthorized
        "409":
          description: PIN already set
    put:
      operationId: changePin
      tags: [auth]
      summary: Change an existing PIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePinInput"
      responses:
        "200":
          description: PIN changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Unauthorized or current PIN incorrect
    delete:
      operationId: deletePin
      tags: [auth]
      summary: Remove the PIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeletePinInput"
      responses:
        "200":
          description: PIN removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Unauthorized or PIN incorrect

  # ─── TOTP management ─────────────────────────────────────────────────────────
  /auth/totp/status:
    get:
      operationId: getTotpStatus
      tags: [auth]
      summary: Check whether TOTP 2FA is enabled for the current user
      responses:
        "200":
          description: TOTP status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpStatus"
        "401":
          description: Unauthorized

  /auth/totp/setup:
    post:
      operationId: setupTotp
      tags: [auth]
      summary: Generate a new TOTP secret and QR code
      responses:
        "200":
          description: QR code and manual entry secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpSetupResult"
        "401":
          description: Unauthorized

  /auth/totp/enable:
    post:
      operationId: enableTotp
      tags: [auth]
      summary: Confirm and enable TOTP using a valid authenticator code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpCodeInput"
      responses:
        "200":
          description: TOTP enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Unauthorized or code incorrect

  /auth/totp/disable:
    delete:
      operationId: disableTotp
      tags: [auth]
      summary: Disable TOTP using a valid authenticator code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpCodeInput"
      responses:
        "200":
          description: TOTP disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Unauthorized or code incorrect

  # ─── PIN login (unauthenticated) ─────────────────────────────────────────────
  /auth/pin-login:
    post:
      operationId: pinLogin
      tags: [auth]
      summary: Authenticate with email + PIN (and optional TOTP code)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PinLoginInput"
      responses:
        "200":
          description: Login result — either a Clerk sign-in token or a TOTP challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PinLoginResult"
        "401":
          description: Invalid credentials

  # ─── Dashboard ───────────────────────────────────────────────────────────────
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get user dashboard data
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          description: Unauthorized

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary (level, net worth, XP, completion rates)
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          description: Unauthorized

  /dashboard/stats:
    patch:
      operationId: updateStats
      tags: [dashboard]
      summary: Update character stats (allocate stat points)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatsUpdate"
      responses:
        "200":
          description: Updated dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          description: Unauthorized

  /dashboard/evaluation:
    post:
      operationId: runEvaluation
      tags: [evaluation]
      summary: Run monthly evaluation to update level and stats
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluationInput"
      responses:
        "200":
          description: Evaluation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationResult"
        "401":
          description: Unauthorized

  # ─── Quests ──────────────────────────────────────────────────────────────────
  /quests:
    get:
      operationId: listQuests
      tags: [quests]
      summary: List user quests
      responses:
        "200":
          description: List of quests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quest"
        "401":
          description: Unauthorized
    post:
      operationId: createQuest
      tags: [quests]
      summary: Create a new quest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestInput"
      responses:
        "201":
          description: Created quest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quest"
        "401":
          description: Unauthorized

  /quests/{id}:
    patch:
      operationId: updateQuest
      tags: [quests]
      summary: Update a quest
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestUpdate"
      responses:
        "200":
          description: Updated quest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quest"
        "401":
          description: Unauthorized
        "404":
          description: Quest not found
    delete:
      operationId: deleteQuest
      tags: [quests]
      summary: Delete a quest
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Quest not found

  /quests/{id}/progress:
    post:
      operationId: logQuestProgress
      tags: [quests]
      summary: Log progress on a quest
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestProgressInput"
      responses:
        "200":
          description: Updated quest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quest"
        "401":
          description: Unauthorized
        "404":
          description: Quest not found

  # ─── Skills ──────────────────────────────────────────────────────────────────
  /skills:
    get:
      operationId: listSkills
      tags: [skills]
      summary: List user skills
      responses:
        "200":
          description: List of skills
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Skill"
        "401":
          description: Unauthorized
    post:
      operationId: createSkill
      tags: [skills]
      summary: Add a new skill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillInput"
      responses:
        "201":
          description: Created skill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"
        "401":
          description: Unauthorized

  /skills/{id}:
    patch:
      operationId: updateSkill
      tags: [skills]
      summary: Update a skill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillUpdate"
      responses:
        "200":
          description: Updated skill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"
        "401":
          description: Unauthorized
        "404":
          description: Skill not found
    delete:
      operationId: deleteSkill
      tags: [skills]
      summary: Delete a skill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Skill not found

  /skills/{id}/checkin:
    post:
      operationId: checkinSkill
      tags: [skills]
      summary: Check in a skill (mark as done for today)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated skill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"
        "401":
          description: Unauthorized
        "404":
          description: Skill not found

  # ─── Builds (Guild Hall) ─────────────────────────────────────────────────────
  /builds:
    get:
      operationId: listBuilds
      tags: [builds]
      summary: List user builds (income streams / businesses)
      responses:
        "200":
          description: List of builds
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Build"
        "401":
          description: Unauthorized
    post:
      operationId: createBuild
      tags: [builds]
      summary: Create a new build
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuildInput"
      responses:
        "201":
          description: Created build
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Build"
        "401":
          description: Unauthorized

  /builds/{id}:
    patch:
      operationId: updateBuild
      tags: [builds]
      summary: Update a build
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuildUpdate"
      responses:
        "200":
          description: Updated build
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Build"
        "401":
          description: Unauthorized
        "404":
          description: Build not found
    delete:
      operationId: deleteBuild
      tags: [builds]
      summary: Delete a build
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Build not found

  # ─── Budget ──────────────────────────────────────────────────────────────────
  /budget:
    get:
      operationId: getBudget
      tags: [budget]
      summary: Get user budget data
      responses:
        "200":
          description: Budget data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
        "401":
          description: Unauthorized
    patch:
      operationId: updateBudget
      tags: [budget]
      summary: Update budget data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetUpdate"
      responses:
        "200":
          description: Updated budget
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
        "401":
          description: Unauthorized

  # ─── Wealth ──────────────────────────────────────────────────────────────────
  /wealth:
    get:
      operationId: getWealth
      tags: [wealth]
      summary: Get user wealth breakdown
      responses:
        "200":
          description: Wealth data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wealth"
        "401":
          description: Unauthorized
    patch:
      operationId: updateWealth
      tags: [wealth]
      summary: Update wealth data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WealthUpdate"
      responses:
        "200":
          description: Updated wealth
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wealth"
        "401":
          description: Unauthorized

  # ─── Admin ───────────────────────────────────────────────────────────────────
  /admin/users:
    get:
      operationId: adminListUsers
      tags: [admin]
      summary: List all users (admin only)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /admin/users/{id}:
    get:
      operationId: adminGetUser
      tags: [admin]
      summary: Get a specific user's full data (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDetail"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: User not found
    patch:
      operationId: adminUpdateUser
      tags: [admin]
      summary: Update a user (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: User not found
    delete:
      operationId: adminDeleteUser
      tags: [admin]
      summary: Delete a user (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: User not found

  /admin/stats:
    get:
      operationId: adminGetStats
      tags: [admin]
      summary: Get platform-wide stats (admin only)
      responses:
        "200":
          description: Platform stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /admin/leaderboard:
    get:
      operationId: adminGetLeaderboard
      tags: [admin]
      summary: Get top users by level and net worth (admin only)
      responses:
        "200":
          description: Leaderboard
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /admin/quests/push:
    post:
      operationId: adminPushQuest
      tags: [admin]
      summary: Push a system quest to one or all users (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPushQuestInput"
      responses:
        "200":
          description: Quest pushed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPushQuestResult"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /admin/badges:
    get:
      operationId: adminListBadges
      tags: [admin]
      summary: List all badges (admin only)
      responses:
        "200":
          description: List of badges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminBadge"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
    post:
      operationId: adminCreateBadge
      tags: [admin]
      summary: Create a badge (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminBadgeInput"
      responses:
        "201":
          description: Badge created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBadge"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /admin/badges/{id}:
    patch:
      operationId: adminUpdateBadge
      tags: [admin]
      summary: Update a badge (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminBadgeUpdate"
      responses:
        "200":
          description: Badge updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBadge"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Badge not found
    delete:
      operationId: adminDeleteBadge
      tags: [admin]
      summary: Delete a badge (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Badge not found

  /admin/milestones:
    get:
      operationId: adminListMilestones
      tags: [admin]
      summary: List all milestones (admin only)
      responses:
        "200":
          description: List of milestones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminMilestone"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
    post:
      operationId: adminCreateMilestone
      tags: [admin]
      summary: Create a milestone (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminMilestoneInput"
      responses:
        "201":
          description: Milestone created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMilestone"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /admin/milestones/{id}:
    patch:
      operationId: adminUpdateMilestone
      tags: [admin]
      summary: Update a milestone (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminMilestoneUpdate"
      responses:
        "200":
          description: Milestone updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMilestone"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Milestone not found
    delete:
      operationId: adminDeleteMilestone
      tags: [admin]
      summary: Delete a milestone (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Milestone not found

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ─── User ──────────────────────────────────────────────────────────────────
    UserProfile:
      type: object
      required: [id, clerkId, displayName, isAdmin, createdAt]
      properties:
        id:          { type: integer }
        clerkId:     { type: string }
        displayName: { type: string }
        avatarUrl:   { type: ["string", "null"] }
        isAdmin:     { type: boolean }
        createdAt:   { type: string, format: date-time }

    UserProfileUpdate:
      type: object
      properties:
        displayName: { type: string, minLength: 1 }
        avatarUrl:   { type: string }

    # ─── Dashboard / Character ─────────────────────────────────────────────────
    CharacterStats:
      type: object
      required: [str, vit, int, agi, per, luk, unspentPoints]
      properties:
        str:           { type: integer, description: "Investment Growth" }
        vit:           { type: integer, description: "Net Worth Stability" }
        int:           { type: integer, description: "Diversification" }
        agi:           { type: integer, description: "Savings Rate" }
        per:           { type: integer, description: "Budget Discipline" }
        luk:           { type: integer, description: "Emergency Fund" }
        unspentPoints: { type: integer }

    Dashboard:
      type: object
      required: [id, userId, displayName, title, level, xp, xpToNext, netWorth, totalAssets, stats, systemLog]
      properties:
        id:          { type: integer }
        userId:      { type: integer }
        displayName: { type: string }
        title:       { type: string }
        level:       { type: integer }
        rank:        { type: string }
        xp:          { type: integer }
        xpToNext:    { type: integer }
        netWorth:    { type: number }
        totalAssets: { type: number }
        stats:
          $ref: "#/components/schemas/CharacterStats"
        systemLog:
          type: array
          items: { type: string }

    DashboardSummary:
      type: object
      required: [level, rank, netWorth, xp, xpToNext, questCompletionRate, activeQuests, totalSkills, totalBuilds]
      properties:
        level:               { type: integer }
        rank:                { type: string }
        netWorth:            { type: number }
        xp:                  { type: integer }
        xpToNext:            { type: integer }
        questCompletionRate: { type: number }
        activeQuests:        { type: integer }
        totalSkills:         { type: integer }
        totalBuilds:         { type: integer }

    StatsUpdate:
      type: object
      properties:
        str: { type: integer }
        vit: { type: integer }
        int: { type: integer }
        agi: { type: integer }
        per: { type: integer }
        luk: { type: integer }

    # ─── Evaluation ────────────────────────────────────────────────────────────
    EvaluationInput:
      type: object
      required: [netWorth, savingsRate, budgetAdherence, emergencyFundMonths]
      properties:
        netWorth:             { type: number }
        savingsRate:          { type: number, description: "Percentage 0-100" }
        budgetAdherence:      { type: number, description: "Percentage 0-100" }
        emergencyFundMonths:  { type: number }
        investmentGrowth:     { type: number, description: "Percentage" }
        diversificationScore: { type: number, description: "0-100" }

    EvaluationResult:
      type: object
      required: [xpGained, leveledUp, newLevel, newXp, updatedDashboard]
      properties:
        xpGained:         { type: integer }
        leveledUp:        { type: boolean }
        newLevel:         { type: integer }
        newXp:            { type: integer }
        updatedDashboard:
          $ref: "#/components/schemas/Dashboard"

    # ─── Quests ────────────────────────────────────────────────────────────────
    Quest:
      type: object
      required: [id, userId, title, category, targetAmount, currentAmount, xpReward, frequency, completed, completedAt, dataLink, createdAt]
      properties:
        id:            { type: integer }
        userId:        { type: integer }
        title:         { type: string }
        description:   { type: ["string", "null"] }
        category:      { type: string, enum: [SYSTEM, SELF] }
        targetAmount:  { type: ["number", "null"] }
        currentAmount: { type: number }
        xpReward:      { type: integer }
        frequency:     { type: string, enum: [DAILY, WEEKLY, MONTHLY, ONGOING] }
        completed:     { type: boolean }
        completedAt:   { type: ["string", "null"], format: date-time }
        dataLink:      { type: ["string", "null"], enum: [NET_WORTH, MONTHLY_SAVINGS, TOTAL_EXPENSES, null] }
        createdAt:     { type: string, format: date-time }

    QuestInput:
      type: object
      required: [title, xpReward, frequency]
      properties:
        title:        { type: string, minLength: 1 }
        description:  { type: string }
        category:     { type: string, enum: [SYSTEM, SELF] }
        targetAmount: { type: number }
        xpReward:     { type: integer }
        frequency:    { type: string, enum: [DAILY, WEEKLY, MONTHLY, ONGOING] }
        dataLink:     { type: string, enum: [NET_WORTH, MONTHLY_SAVINGS, TOTAL_EXPENSES] }

    QuestUpdate:
      type: object
      properties:
        title:         { type: string, minLength: 1 }
        description:   { type: string }
        targetAmount:  { type: number }
        currentAmount: { type: number }
        xpReward:      { type: integer }
        completed:     { type: boolean }
        completedAt:   { type: ["string", "null"], format: date-time }

    QuestProgressInput:
      type: object
      required: [amount]
      properties:
        amount: { type: number }

    # ─── Skills ────────────────────────────────────────────────────────────────
    Skill:
      type: object
      required: [id, userId, name, category, type, level, streakCount, lastCheckin, createdAt]
      properties:
        id:          { type: integer }
        userId:      { type: integer }
        name:        { type: string }
        category:    { type: string, enum: [INVESTMENT, SAVINGS, KNOWLEDGE] }
        type:        { type: string, enum: [SYSTEM, SELF] }
        level:       { type: integer }
        streakCount: { type: integer }
        lastCheckin: { type: ["string", "null"], format: date-time }
        xpToNext:    { type: integer }
        createdAt:   { type: string, format: date-time }

    SkillInput:
      type: object
      required: [name, category]
      properties:
        name:     { type: string, minLength: 1 }
        category: { type: string, enum: [INVESTMENT, SAVINGS, KNOWLEDGE] }
        type:     { type: string, enum: [SYSTEM, SELF] }

    SkillUpdate:
      type: object
      properties:
        name:     { type: string, minLength: 1 }
        category: { type: string, enum: [INVESTMENT, SAVINGS, KNOWLEDGE] }

    # ─── Builds ────────────────────────────────────────────────────────────────
    Build:
      type: object
      required: [id, userId, name, description, rank, revenue, expenses, createdAt]
      properties:
        id:          { type: integer }
        userId:      { type: integer }
        name:        { type: string }
        description: { type: string }
        rank:        { type: string, enum: [S, A, B, C, D, E] }
        revenue:     { type: number }
        expenses:    { type: number }
        netProfit:   { type: number }
        createdAt:   { type: string, format: date-time }

    BuildInput:
      type: object
      required: [name, description]
      properties:
        name:        { type: string, minLength: 1 }
        description: { type: string }
        rank:        { type: string, enum: [S, A, B, C, D, E] }
        revenue:     { type: number }
        expenses:    { type: number }

    BuildUpdate:
      type: object
      properties:
        name:        { type: string, minLength: 1 }
        description: { type: string }
        rank:        { type: string, enum: [S, A, B, C, D, E] }
        revenue:     { type: number }
        expenses:    { type: number }

    # ─── Budget ────────────────────────────────────────────────────────────────
    BudgetItem:
      type: object
      required: [id, label, planned, actual]
      properties:
        id:      { type: integer }
        label:   { type: string }
        planned: { type: number }
        actual:  { type: number }

    Budget:
      type: object
      required: [id, userId, monthlyIncome, items, updatedAt]
      properties:
        id:            { type: integer }
        userId:        { type: integer }
        monthlyIncome: { type: number }
        items:
          type: array
          items:
            $ref: "#/components/schemas/BudgetItem"
        updatedAt: { type: string, format: date-time }

    BudgetItemInput:
      type: object
      required: [label, planned, actual]
      properties:
        label:   { type: string }
        planned: { type: number }
        actual:  { type: number }

    BudgetUpdate:
      type: object
      properties:
        monthlyIncome: { type: number }
        items:
          type: array
          items:
            $ref: "#/components/schemas/BudgetItemInput"

    # ─── Wealth ────────────────────────────────────────────────────────────────
    WealthAsset:
      type: object
      required: [id, label, amount, category]
      properties:
        id:       { type: integer }
        label:    { type: string }
        amount:   { type: number }
        category: { type: string, enum: [STOCKS, MUTUAL_FUNDS, REAL_ESTATE, CASH, CRYPTO, OTHER] }

    Wealth:
      type: object
      required: [id, userId, netWorth, assets, updatedAt]
      properties:
        id:       { type: integer }
        userId:   { type: integer }
        netWorth: { type: number }
        assets:
          type: array
          items:
            $ref: "#/components/schemas/WealthAsset"
        updatedAt: { type: string, format: date-time }

    WealthAssetInput:
      type: object
      required: [label, amount, category]
      properties:
        label:    { type: string }
        amount:   { type: number }
        category: { type: string, enum: [STOCKS, MUTUAL_FUNDS, REAL_ESTATE, CASH, CRYPTO, OTHER] }

    WealthUpdate:
      type: object
      properties:
        netWorth: { type: number }
        assets:
          type: array
          items:
            $ref: "#/components/schemas/WealthAssetInput"

    # ─── Admin — Badges / Milestones / Quest Push ─────────────────────────────
    AdminBadge:
      type: object
      required: [id, name, description, icon, rarity, triggerType, triggerValue, createdAt]
      properties:
        id:           { type: integer }
        name:         { type: string }
        description:  { type: string }
        icon:         { type: string }
        rarity:       { type: string, enum: [COMMON, RARE, EPIC, LEGENDARY] }
        triggerType:  { type: string, enum: [MANUAL, QUEST_COUNT, SKILL_COUNT, BUILD_COUNT, NET_WORTH, LEVEL, DAYS_ACTIVE] }
        triggerValue: { type: integer }
        createdAt:    { type: string, format: date-time }

    AdminBadgeInput:
      type: object
      required: [name]
      properties:
        name:         { type: string, minLength: 1 }
        description:  { type: string }
        icon:         { type: string }
        rarity:       { type: string, enum: [COMMON, RARE, EPIC, LEGENDARY] }
        triggerType:  { type: string, enum: [MANUAL, QUEST_COUNT, SKILL_COUNT, BUILD_COUNT, NET_WORTH, LEVEL, DAYS_ACTIVE] }
        triggerValue: { type: integer }

    AdminBadgeUpdate:
      type: object
      properties:
        name:         { type: string, minLength: 1 }
        description:  { type: string }
        icon:         { type: string }
        rarity:       { type: string, enum: [COMMON, RARE, EPIC, LEGENDARY] }
        triggerType:  { type: string, enum: [MANUAL, QUEST_COUNT, SKILL_COUNT, BUILD_COUNT, NET_WORTH, LEVEL, DAYS_ACTIVE] }
        triggerValue: { type: integer }

    AdminMilestone:
      type: object
      required: [id, name, description, icon, category, threshold, xpReward, createdAt]
      properties:
        id:          { type: integer }
        name:        { type: string }
        description: { type: string }
        icon:        { type: string }
        category:    { type: string, enum: [QUEST, SKILL, BUILD, WEALTH, CHARACTER] }
        threshold:   { type: number }
        xpReward:    { type: integer }
        createdAt:   { type: string, format: date-time }

    AdminMilestoneInput:
      type: object
      required: [name]
      properties:
        name:        { type: string, minLength: 1 }
        description: { type: string }
        icon:        { type: string }
        category:    { type: string, enum: [QUEST, SKILL, BUILD, WEALTH, CHARACTER] }
        threshold:   { type: number }
        xpReward:    { type: integer }

    AdminMilestoneUpdate:
      type: object
      properties:
        name:        { type: string, minLength: 1 }
        description: { type: string }
        icon:        { type: string }
        category:    { type: string, enum: [QUEST, SKILL, BUILD, WEALTH, CHARACTER] }
        threshold:   { type: number }
        xpReward:    { type: integer }

    AdminPushQuestInput:
      type: object
      required: [title]
      properties:
        userId:       { type: integer }
        title:        { type: string, minLength: 1 }
        description:  { type: string }
        category:     { type: string, enum: [SYSTEM, SELF] }
        targetAmount: { type: number }
        xpReward:     { type: integer }
        frequency:    { type: string, enum: [DAILY, WEEKLY, MONTHLY, ONGOING] }

    AdminPushQuestResult:
      type: object
      required: [pushed, message]
      properties:
        pushed:  { type: integer }
        message: { type: string }

    # ─── Admin ─────────────────────────────────────────────────────────────────
    AdminUser:
      type: object
      required: [id, clerkId, displayName, isAdmin, level, netWorth, xp, questCount, skillCount, buildCount, createdAt]
      properties:
        id:          { type: integer }
        clerkId:     { type: string }
        displayName: { type: string }
        avatarUrl:   { type: ["string", "null"] }
        isAdmin:     { type: boolean }
        level:       { type: integer }
        rank:        { type: string }
        netWorth:    { type: number }
        xp:          { type: integer }
        questCount:  { type: integer }
        skillCount:  { type: integer }
        buildCount:  { type: integer }
        createdAt:   { type: string, format: date-time }

    AdminUserDetail:
      type: object
      required: [user, dashboard, quests, skills, builds]
      properties:
        user:
          $ref: "#/components/schemas/AdminUser"
        dashboard:
          $ref: "#/components/schemas/Dashboard"
        quests:
          type: array
          items:
            $ref: "#/components/schemas/Quest"
        skills:
          type: array
          items:
            $ref: "#/components/schemas/Skill"
        builds:
          type: array
          items:
            $ref: "#/components/schemas/Build"

    AdminUserUpdate:
      type: object
      properties:
        displayName: { type: string }
        isAdmin:     { type: boolean }

    AdminStats:
      type: object
      required: [totalUsers, activeUsers, avgLevel, avgNetWorth, totalQuests, totalBuilds]
      properties:
        totalUsers:   { type: integer }
        activeUsers:  { type: integer }
        avgLevel:     { type: number }
        avgNetWorth:  { type: number }
        totalQuests:  { type: integer }
        totalBuilds:  { type: integer }

    LeaderboardEntry:
      type: object
      required: [rank, userId, displayName, level, netWorth, xp]
      properties:
        rank:        { type: integer }
        userId:      { type: integer }
        displayName: { type: string }
        avatarUrl:   { type: ["string", "null"] }
        level:       { type: integer }
        tierRank:    { type: string }
        netWorth:    { type: number }
        xp:          { type: integer }

    # ─── Auth / PIN / TOTP ─────────────────────────────────────────────────────
    SuccessResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean }

    PinStatus:
      type: object
      required: [hasPinSet]
      properties:
        hasPinSet: { type: boolean }

    CreatePinInput:
      type: object
      required: [pin]
      properties:
        pin: { type: string, minLength: 4, maxLength: 6, pattern: "^\\d{4,6}$" }

    ChangePinInput:
      type: object
      required: [currentPin, newPin]
      properties:
        currentPin: { type: string, minLength: 4, maxLength: 6, pattern: "^\\d{4,6}$" }
        newPin:     { type: string, minLength: 4, maxLength: 6, pattern: "^\\d{4,6}$" }

    DeletePinInput:
      type: object
      required: [pin]
      properties:
        pin: { type: string, minLength: 4, maxLength: 6, pattern: "^\\d{4,6}$" }

    TotpStatus:
      type: object
      required: [totpEnabled]
      properties:
        totpEnabled: { type: boolean }

    TotpSetupResult:
      type: object
      required: [qrDataUrl, secret]
      properties:
        qrDataUrl: { type: string }
        secret:    { type: string }

    TotpCodeInput:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 6, maxLength: 6, pattern: "^\\d{6}$" }

    PinLoginInput:
      type: object
      required: [email, pin]
      properties:
        email:    { type: string }
        pin:      { type: string, minLength: 4, maxLength: 6, pattern: "^\\d{4,6}$" }
        totpCode: { type: string, minLength: 6, maxLength: 6, pattern: "^\\d{6}$" }

    PinLoginResult:
      type: object
      properties:
        token:         { type: string }
        requiresTotp:  { type: boolean }
